name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  IMAGE: ghcr.io/nsa09-nsa09/ecopay-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Flyway duplicate-version preflight
        shell: pwsh
        run: ./scripts/check-flyway-duplicates.ps1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ensure Docker is available for Testcontainers
        run: |
          if ! docker info >/dev/null 2>&1; then
            sudo systemctl start docker || sudo service docker start
          fi
          docker info

      - name: Build and test
        run: ./mvnw -B verify

  build-push:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    concurrency:
      group: ecopay-backend-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    concurrency:
      group: ecopay-deploy-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      # main -> "backend" (prod service),  dev -> "backend-dev"
      - name: Compute target service
        id: svc
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "name=backend" >> "$GITHUB_OUTPUT"
          else
            echo "name=backend-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/ecopay
            export ECOPAY_BACKEND_IMAGE=${{ env.IMAGE }}:${{ github.sha }}
            docker compose pull ${{ steps.svc.outputs.name }}
            docker compose up -d ${{ steps.svc.outputs.name }}
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8080/actuator/health/readiness >/dev/null; then
                docker image prune -f
                exit 0
              fi
              sleep 5
            done
            docker compose logs --tail=200 ${{ steps.svc.outputs.name }} | sed -E 's/(Authorization: Bearer )[A-Za-z0-9._-]+/\1[REDACTED]/g; s/(pg_sig=)[^&[:space:]]+/\1[REDACTED]/g; s/(JWT_SECRET|FREEDOMPAY_SECRET_KEY|FREEDOMPAY_PAYOUT_SECRET_KEY)=[^[:space:]]+/\1=[REDACTED]/g'
            exit 1
