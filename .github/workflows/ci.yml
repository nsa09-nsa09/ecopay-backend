name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  IMAGE: ghcr.io/nsa09-nsa09/ecopay-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Flyway duplicate-version preflight
        shell: pwsh
        run: ./scripts/check-flyway-duplicates.ps1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ensure Docker is available for Testcontainers
        run: |
          if ! docker info >/dev/null 2>&1; then
            sudo systemctl start docker || sudo service docker start
          fi
          docker info

      - name: Build and test
        run: ./mvnw -B verify

  build-push:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    concurrency:
      group: ecopay-backend-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Save SHA image for deterministic deploy
        run: |
          docker pull "${IMAGE}:${GITHUB_SHA}"
          docker save "${IMAGE}:${GITHUB_SHA}" | gzip > ecopay-backend-image.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: ecopay-backend-image-${{ github.sha }}
          path: ecopay-backend-image.tar.gz
          retention-days: 1

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    concurrency:
      group: ecopay-deploy-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      # main -> "backend" (prod service),  dev -> "backend-dev"
      - name: Compute target service
        id: svc
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "name=backend" >> "$GITHUB_OUTPUT"
            echo "public_url_required=true" >> "$GITHUB_OUTPUT"
          else
            echo "name=backend-dev" >> "$GITHUB_OUTPUT"
            echo "public_url_required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate frontend public URL config
        env:
          FRONTEND_PUBLIC_URL: ${{ vars.FRONTEND_PUBLIC_URL }}
        run: |
          set -euo pipefail
          if [ "${{ steps.svc.outputs.public_url_required }}" = "true" ] && [ -z "${FRONTEND_PUBLIC_URL:-}" ]; then
            echo "::error::FRONTEND_PUBLIC_URL is not configured for the production GitHub Environment"
            exit 1
          fi
          if [ -n "${FRONTEND_PUBLIC_URL:-}" ] && ! printf '%s' "$FRONTEND_PUBLIC_URL" | grep -Eq '^https://[^[:space:]]+$'; then
            echo "::error::FRONTEND_PUBLIC_URL must be an HTTPS URL without whitespace"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: ecopay-backend-image-${{ github.sha }}

      - name: Copy image archive to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: ecopay-backend-image.tar.gz
          target: /tmp/ecopay-backend-${{ github.sha }}
          overwrite: true

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /opt/ecopay

            SERVICE="${{ steps.svc.outputs.name }}"
            IMAGE="${{ env.IMAGE }}:${{ github.sha }}"
            FRONTEND_PUBLIC_URL="${{ vars.FRONTEND_PUBLIC_URL }}"
            ARCHIVE="/tmp/ecopay-backend-${{ github.sha }}/ecopay-backend-image.tar.gz"
            OVERRIDE="$(mktemp)"
            trap 'rm -f "$OVERRIDE"; rm -rf "/tmp/ecopay-backend-${{ github.sha }}"' EXIT

            cat > "$OVERRIDE" <<EOF
            services:
              ${SERVICE}:
                image: ${IMAGE}
            EOF
            if [ -n "${FRONTEND_PUBLIC_URL:-}" ]; then
              cat >> "$OVERRIDE" <<EOF
                environment:
                  APP_FRONTEND_URL: ${FRONTEND_PUBLIC_URL}
                  APP_PUBLIC_URL: ${FRONTEND_PUBLIC_URL}
            EOF
            fi

            echo "Resolved compose images:"
            docker compose -f docker-compose.yml -f "$OVERRIDE" config --images

            RESOLVED_IMAGE="$(
              docker compose -f docker-compose.yml -f "$OVERRIDE" config |
                awk -v service="$SERVICE" '
                  $0 ~ "^  " service ":" { in_service = 1; next }
                  in_service && $0 ~ "^  [A-Za-z0-9_.-]+:" { in_service = 0 }
                  in_service && $1 == "image:" { print $2; exit }
                '
            )"
            if [ "$RESOLVED_IMAGE" != "$IMAGE" ]; then
              echo "Target service image mismatch: expected $IMAGE, got ${RESOLVED_IMAGE:-<empty>}" >&2
              exit 1
            fi

            echo "Disk status before image load:"
            df -h
            echo "Memory status before image load:"
            free -m
            echo "Docker disk usage before image load:"
            docker system df

            if [ ! -s "$ARCHIVE" ]; then
              echo "Image archive missing or empty: $ARCHIVE" >&2
              exit 1
            fi

            echo "Loading exact image archive: $IMAGE"
            gzip -dc "$ARCHIVE" | docker load
            docker image inspect "$IMAGE" >/dev/null
            echo "Exact image loaded successfully"

            PREVIOUS_CID="$(docker compose -f docker-compose.yml -f "$OVERRIDE" ps -q "$SERVICE" || true)"
            PREVIOUS_IMAGE=""
            if [ -n "$PREVIOUS_CID" ]; then
              PREVIOUS_IMAGE="$(docker inspect -f '{{.Config.Image}}' "$PREVIOUS_CID" || true)"
              echo "Previous running image: ${PREVIOUS_IMAGE:-<unknown>}"
            fi

            docker compose -f docker-compose.yml -f "$OVERRIDE" up -d --no-deps --pull never "$SERVICE"

            CID="$(docker compose -f docker-compose.yml -f "$OVERRIDE" ps -q "$SERVICE")"
            if [ -z "$CID" ]; then
              echo "No running container id found for $SERVICE" >&2
              docker compose -f docker-compose.yml -f "$OVERRIDE" ps -a "$SERVICE" || true
              exit 1
            fi

            ACTUAL="$(docker inspect -f '{{.Config.Image}}' "$CID")"
            echo "Expected running image: $IMAGE"
            echo "Actual running image:   $ACTUAL"
            if [ "$ACTUAL" != "$IMAGE" ]; then
              echo "Running container image mismatch" >&2
              docker ps -a --filter "id=$CID" || true
              docker inspect "$CID" --format 'status={{.State.Status}} exit={{.State.ExitCode}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' || true
              exit 1
            fi

            for i in $(seq 1 30); do
              if docker exec "$CID" \
                   curl -fsS http://127.0.0.1:8080/actuator/health/readiness >/dev/null; then
                echo "Backend readiness OK"
                docker image prune -f
                exit 0
              fi
              echo "Readiness $i/30"
              sleep 5
            done
            if [ -n "${CID:-}" ]; then
              docker ps -a --filter "id=$CID" || true
              docker inspect "$CID" --format 'status={{.State.Status}} exit={{.State.ExitCode}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' || true
              docker logs --tail=200 "$CID" | sed -E 's/(Authorization: Bearer )[A-Za-z0-9._-]+/\1[REDACTED]/g; s/(pg_sig=)[^&[:space:]]+/\1[REDACTED]/g; s/(JWT_SECRET|FREEDOMPAY_SECRET_KEY|FREEDOMPAY_PAYOUT_SECRET_KEY)=[^[:space:]]+/\1=[REDACTED]/g'
            else
              docker compose -f docker-compose.yml -f "$OVERRIDE" ps -a "$SERVICE" || true
            fi
            if [ -n "${PREVIOUS_IMAGE:-}" ] && [ "$PREVIOUS_IMAGE" != "$IMAGE" ]; then
              echo "Restoring previous image: $PREVIOUS_IMAGE"
              cat > "$OVERRIDE" <<EOF
            services:
              ${SERVICE}:
                image: ${PREVIOUS_IMAGE}
            EOF
              docker compose -f docker-compose.yml -f "$OVERRIDE" up -d --no-deps --pull never "$SERVICE" || true
            fi
            exit 1
