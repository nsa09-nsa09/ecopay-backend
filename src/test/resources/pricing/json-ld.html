<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JSON-LD fixture</title>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Product",
  "name": "Sample Subscription",
  "offers": {
    "@type": "Offer",
    "price": "9.99",
    "priceCurrency": "USD",
    "availability": "https://schema.org/InStock"
  }
}
</script>
</head>
<body>
<h1>Sample Subscription</h1>
<p>Structured price sits in the JSON-LD block above.</p>
</body>
</html>
