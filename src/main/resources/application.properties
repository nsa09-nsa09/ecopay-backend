spring.application.name=split-up-auth

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB}${POSTGRES_URL_PARAMS:}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.sql.init.mode=never

# Honour X-Forwarded-* from the reverse proxy (Dokploy/Traefik) so request-derived
# URLs (e.g. avatar links) use the public scheme/host instead of the internal one.
server.forward-headers-strategy=framework

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Almaty
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Single source of truth for time: every JSON timestamp is serialized as
# Asia/Almaty wall clock. LocalDateTime fields are wrapped to +05:00 via a
# custom serializer registered in JacksonAlmatyConfig / JacksonLegacyConfig.
spring.jackson.time-zone=Asia/Almaty

jwt.secret=${JWT_SECRET}
jwt.access-expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}
app.security.field-encryption-key=${APP_SECURITY_FIELD_ENCRYPTION_KEY}
app.auth.refresh-cookie-secure=${APP_AUTH_REFRESH_COOKIE_SECURE:true}
app.auth.refresh-token-body-enabled=${APP_AUTH_REFRESH_TOKEN_BODY_ENABLED:false}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.from=${MAIL_USERNAME}
# Connect/read timeouts so a hung SMTP host cannot pin a request thread. Without
# these, JavaMail waits indefinitely.
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECT_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_READ_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:5000}

# --- Email validation & delivery -------------------------------------------
# Level 2 of the validation pipeline: reject domains that publish no MX (and no
# A) record, so we never spend a confirmation email on a domain that provably
# cannot receive mail. A DNS failure is treated as "unverifiable" and passes —
# our resolver being down must not block legitimate signups.
app.email.mx-check.enabled=${APP_EMAIL_MX_CHECK_ENABLED:true}
app.email.mx-check.timeout-ms=${APP_EMAIL_MX_CHECK_TIMEOUT_MS:2500}
app.email.mx-check.cache-ttl-minutes=${APP_EMAIL_MX_CHECK_CACHE_TTL_MINUTES:1440}
app.email.mx-check.cache-max-size=${APP_EMAIL_MX_CHECK_CACHE_MAX_SIZE:10000}

# Transient SMTP failures are retried with exponential backoff (500ms, 1s, 2s…).
app.email.send.max-attempts=${APP_EMAIL_SEND_MAX_ATTEMPTS:3}
app.email.send.retry-backoff-ms=${APP_EMAIL_SEND_RETRY_BACKOFF_MS:500}

# Probe SMTP once at boot and WARN if unreachable. Never fatal: mail is not on
# the critical path for browsing or for logging in with a verified account.
app.email.startup-check.enabled=${APP_EMAIL_STARTUP_CHECK_ENABLED:true}

app.rate-limit.login.attempts=${APP_RATE_LIMIT_LOGIN_ATTEMPTS:5}
app.rate-limit.login.duration-minutes=${APP_RATE_LIMIT_LOGIN_DURATION_MINUTES:15}
# User-submitted feedback per account per hour. Mirrors RateLimitService style.
# Must stay > 0 — a zero value disables the per-user limiter entirely.
app.rate-limit.feedback.max-per-hour=${APP_RATE_LIMIT_FEEDBACK_MAX_PER_HOUR:5}
# Second layer: per-IP cap so one actor cycling through accounts can't blast.
app.rate-limit.feedback.ip-max-per-hour=${APP_RATE_LIMIT_FEEDBACK_IP_MAX_PER_HOUR:20}

# ── Room creation anti-abuse (per user). Three independent layers; change the
# numbers freely without code edits. Set a *-max to 0 to disable that layer.
# 1) Burst: short-window cap against spamming many rooms at once.
app.rate-limit.room-create.burst-max=${APP_RATE_LIMIT_ROOM_CREATE_BURST_MAX:5}
app.rate-limit.room-create.burst-window-seconds=${APP_RATE_LIMIT_ROOM_CREATE_BURST_WINDOW_SECONDS:600}
# 2) Daily: rolling 24h cap so one user can't create a flood over a day.
app.rate-limit.room-create.daily-max=${APP_RATE_LIMIT_ROOM_CREATE_DAILY_MAX:10}
app.rate-limit.room-create.daily-window-seconds=${APP_RATE_LIMIT_ROOM_CREATE_DAILY_WINDOW_SECONDS:86400}
# 3) Overall: hard ceiling on simultaneously-live rooms (OPEN/IN_VERIFICATION/ACTIVE) per owner.
app.rate-limit.room-create.max-active-per-owner=${APP_RATE_LIMIT_ROOM_CREATE_MAX_ACTIVE_PER_OWNER:10}

# Room join anti-abuse (per user, sliding window).
app.rate-limit.room-join.max=${APP_RATE_LIMIT_ROOM_JOIN_MAX:20}
app.rate-limit.room-join.window-seconds=${APP_RATE_LIMIT_ROOM_JOIN_WINDOW_SECONDS:600}

# FX scheduler tuning. Hours between intraday refreshes — kept long enough to
# stay well under any free-tier upstream quota.
app.fx.refresh-interval-hours=${APP_FX_REFRESH_INTERVAL_HOURS:6}
# Public Cache-Control max-age on GET /api/v1/fx/rates (seconds).
app.fx.response-cache-seconds=${APP_FX_RESPONSE_CACHE_SECONDS:900}

# Price Watch — background monitor for third-party subscription prices.
# Toggle the whole module off (scheduler + auto-checks) with app.pricing.enabled=false;
# admin CRUD keeps working either way.
app.pricing.enabled=${APP_PRICING_ENABLED:true}
# Scheduler tick in minutes. The tick just picks providers whose next_check_at has
# come due; each provider's own interval (check_interval_minutes on the row) sets
# how often it actually re-polls.
app.pricing.tick-minutes=${APP_PRICING_TICK_MINUTES:5}
# Default interval used when a provider is created without an explicit one (12h).
app.pricing.default-interval-minutes=${APP_PRICING_DEFAULT_INTERVAL_MINUTES:720}
# Per-request HTTP timeout on outbound fetches.
app.pricing.timeout-seconds=${APP_PRICING_TIMEOUT_SECONDS:8}
app.pricing.connect-timeout-seconds=${APP_PRICING_CONNECT_TIMEOUT_SECONDS:3}
app.pricing.max-compressed-bytes=${APP_PRICING_MAX_COMPRESSED_BYTES:2097152}
app.pricing.max-decompressed-bytes=${APP_PRICING_MAX_DECOMPRESSED_BYTES:8388608}
app.pricing.max-header-bytes=${APP_PRICING_MAX_HEADER_BYTES:32768}
app.pricing.max-redirects=${APP_PRICING_MAX_REDIRECTS:2}
app.pricing.allowed-ports=${APP_PRICING_ALLOWED_PORTS:443}
app.pricing.allowed-hosts=${APP_PRICING_ALLOWED_HOSTS:}
app.pricing.allow-http=${APP_PRICING_ALLOW_HTTP:false}
app.pricing.min-interval-minutes=${APP_PRICING_MIN_INTERVAL_MINUTES:15}
app.pricing.max-interval-minutes=${APP_PRICING_MAX_INTERVAL_MINUTES:43200}
app.pricing.max-price=${APP_PRICING_MAX_PRICE:1000000}
app.pricing.lease-minutes=${APP_PRICING_LEASE_MINUTES:10}
app.pricing.store-sanitized-snippet=${APP_PRICING_STORE_SANITIZED_SNIPPET:false}
app.pricing.admin-rate-limit.max=${APP_PRICING_ADMIN_RATE_LIMIT_MAX:20}
app.pricing.admin-rate-limit.window-seconds=${APP_PRICING_ADMIN_RATE_LIMIT_WINDOW_SECONDS:60}
# Concurrency caps for the scheduler's worker pool.
app.pricing.max-concurrency=${APP_PRICING_MAX_CONCURRENCY:3}
app.pricing.per-domain-concurrency=${APP_PRICING_PER_DOMAIN_CONCURRENCY:1}
# Refresh all due providers on ApplicationReadyEvent. Off by default — turn it on
# only in local dev if you want live data as soon as the app boots.
app.pricing.startup-refresh=${APP_PRICING_STARTUP_REFRESH:false}
# Consecutive failures that flip a provider into FAILING + active=false.
app.pricing.failure-threshold=${APP_PRICING_FAILURE_THRESHOLD:5}
# Outbound User-Agent used on price fetches. Kept as a full realistic Chrome string
# since many providers 403 unknown UAs.
app.pricing.user-agent=${APP_PRICING_USER_AGENT:Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Public brand/contact values. Leave support email empty until a real address exists.
app.brand.name=${APP_BRAND_NAME:EcoPay}
app.brand.support-email=${APP_SUPPORT_EMAIL:}
app.brand.public-url=${APP_PUBLIC_URL:}

# Public base URL of the backend (used for the email-verification link, handled server-side)
app.base-url=${APP_BASE_URL:http://localhost:8080}
# Public base URL of the frontend SPA (used for the password-reset link, where the user enters a new password)
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# Active payment provider: freedompay (prod) | mock (dev/test)
ecopay.payments.provider=${PAYMENTS_PROVIDER:freedompay}

# Dev/test only: auto-mark new accounts email-verified so flows that require a verified
# email (login) work without SMTP. Defaults OFF; enabled in application-dev.properties.
app.dev.auto-verify-email=${APP_DEV_AUTO_VERIFY_EMAIL:false}

# Freedom Pay payment gateway
ecopay.payments.freedompay.base-url=${FREEDOMPAY_BASE_URL:https://test-api.freedompay.kz}
ecopay.payments.freedompay.merchant-id=${FREEDOMPAY_MERCHANT_ID:}
ecopay.payments.freedompay.secret-key=${FREEDOMPAY_SECRET_KEY:}
ecopay.payments.freedompay.payout-secret-key=${FREEDOMPAY_PAYOUT_SECRET_KEY:}
ecopay.payments.freedompay.result-url=${FREEDOMPAY_RESULT_URL:http://localhost:8080/api/v1/webhooks/freedompay/result}
ecopay.payments.freedompay.payout-result-url=${FREEDOMPAY_PAYOUT_RESULT_URL:http://localhost:8080/api/v1/webhooks/freedompay/payout-result}
ecopay.payments.freedompay.success-url=${FREEDOMPAY_SUCCESS_URL:http://localhost:5173/payment/confirmation}
ecopay.payments.freedompay.failure-url=${FREEDOMPAY_FAILURE_URL:http://localhost:5173/payment/failure}
ecopay.payments.freedompay.test-mode=${FREEDOMPAY_TEST_MODE:1}
# Required by Freedom Pay whenever a card is saved (pg_recurring_start=1). Freedom Pay caps it at 156.
ecopay.payments.freedompay.recurring-lifetime-days=${FREEDOMPAY_RECURRING_LIFETIME_DAYS:156}

# Production MVP: automatic recurring charges are disabled unless explicitly enabled.
app.recurring.enabled=${APP_RECURRING_ENABLED:false}

# Tiered EcoPay commission, charged on top of each member's tariff share (owner pays none).
# Member pays (share + commission); owner is paid the share; EcoPay keeps the commission.
#   share <= tier1-max          -> tier1-fee
#   tier1-max < share <= tier2-max -> tier2-fee
#   tier2-max < share <= tier3-max -> tier3-fee
#   share > tier3-max           -> tier4-fee
app.commission.tier1-max=4000
app.commission.tier2-max=6000
app.commission.tier3-max=8000
app.commission.tier1-fee=500
app.commission.tier2-fee=700
app.commission.tier3-fee=900
app.commission.tier4-fee=1000

# Owner payout-card binding: small verification charge (KZT) used to tokenize the card via the
# provider's hosted page, then auto-refunded. In FreedomPay test mode no real money moves.
app.payout.card-binding-amount=${APP_PAYOUT_CARD_BINDING_AMOUNT:100}

# S3-compatible object storage for avatars (Cloudflare R2)
app.s3.region=${S3_REGION:auto}
app.s3.bucket=${S3_BUCKET:}
app.s3.endpoint=${S3_ENDPOINT:}
app.s3.access-key=${S3_ACCESS_KEY:}
app.s3.secret-key=${S3_SECRET_KEY:}
app.s3.path-style-access=${S3_PATH_STYLE_ACCESS:true}

# SMS provider
ecopay.sms.provider=${SMS_PROVIDER:logging}
ecopay.sms.mobizon.base-url=${MOBIZON_BASE_URL:https://api.mobizon.kz}
ecopay.sms.mobizon.api-key=${MOBIZON_API_KEY:}
ecopay.sms.mobizon.from=${MOBIZON_FROM:EcoPay}
app.sms.code-ttl-seconds=${APP_SMS_CODE_TTL_SECONDS:300}
app.sms.resend-cooldown-seconds=${APP_SMS_RESEND_COOLDOWN_SECONDS:60}
app.sms.max-attempts-per-hour=${APP_SMS_MAX_ATTEMPTS_PER_HOUR:3}
app.sms.max-verify-attempts=${APP_SMS_MAX_VERIFY_ATTEMPTS:5}
app.sms.max-per-ip-per-hour=${APP_SMS_MAX_PER_IP_PER_HOUR:10}
app.sms.max-per-ip-per-day=${APP_SMS_MAX_PER_IP_PER_DAY:30}
# Dev/test-only master phone-verification code. Empty by default so every
# non-dev profile requires the real SMS code.
app.phone.dev-bypass-code=${APP_PHONE_DEV_BYPASS_CODE:}

# Durable Freedom Pay webhook inbox. Processing is at-least-once; downstream money operations
# and the inbox PROCESSED transition commit atomically. Exhausted/non-retryable events remain in
# freedom_webhook_inbox with processing_status=DEAD_LETTER for operational investigation.
app.webhooks.freedom.retry-delay-ms=${APP_WEBHOOKS_FREEDOM_RETRY_DELAY_MS:60000}
app.webhooks.freedom.max-attempts=${APP_WEBHOOKS_FREEDOM_MAX_ATTEMPTS:6}
app.webhooks.freedom.retry-base-seconds=${APP_WEBHOOKS_FREEDOM_RETRY_BASE_SECONDS:30}
app.webhooks.freedom.retry-max-seconds=${APP_WEBHOOKS_FREEDOM_RETRY_MAX_SECONDS:3600}
app.webhooks.freedom.lease-seconds=${APP_WEBHOOKS_FREEDOM_LEASE_SECONDS:300}
app.webhooks.freedom.batch-size=${APP_WEBHOOKS_FREEDOM_BATCH_SIZE:100}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Identifier reveal is sensitive PII access. Owner and staff buckets are separated, and each
# request is limited by actor and roomMember.
app.identifier-reveal.ttl-seconds=${APP_IDENTIFIER_REVEAL_TTL_SECONDS:30}
app.rate-limit.identifier-reveal.owner.burst-max=${APP_RATE_LIMIT_IDENTIFIER_REVEAL_OWNER_BURST_MAX:5}
app.rate-limit.identifier-reveal.owner.burst-window-seconds=${APP_RATE_LIMIT_IDENTIFIER_REVEAL_OWNER_BURST_WINDOW_SECONDS:60}
app.rate-limit.identifier-reveal.owner.daily-max=${APP_RATE_LIMIT_IDENTIFIER_REVEAL_OWNER_DAILY_MAX:30}
app.rate-limit.identifier-reveal.owner.daily-window-seconds=${APP_RATE_LIMIT_IDENTIFIER_REVEAL_OWNER_DAILY_WINDOW_SECONDS:86400}
app.rate-limit.identifier-reveal.staff.burst-max=${APP_RATE_LIMIT_IDENTIFIER_REVEAL_STAFF_BURST_MAX:10}
app.rate-limit.identifier-reveal.staff.burst-window-seconds=${APP_RATE_LIMIT_IDENTIFIER_REVEAL_STAFF_BURST_WINDOW_SECONDS:60}
app.rate-limit.identifier-reveal.staff.daily-max=${APP_RATE_LIMIT_IDENTIFIER_REVEAL_STAFF_DAILY_MAX:80}
app.rate-limit.identifier-reveal.staff.daily-window-seconds=${APP_RATE_LIMIT_IDENTIFIER_REVEAL_STAFF_DAILY_WINDOW_SECONDS:86400}
