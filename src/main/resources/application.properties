spring.application.name=split-up-auth

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB}${POSTGRES_URL_PARAMS:}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Capacity / connection pool ---------------------------------------------
# open-in-view=false: the Hibernate session is closed when the @Transactional
# service method returns, so no DB connection is held for the duration of view
# rendering / JSON serialization. This frees pool connections far sooner and is
# required for the pool sizing below to mean anything. The trade-off is that any
# lazy association touched AFTER the service transaction throws
# LazyInitializationException — those are fetched eagerly via @EntityGraph /
# join fetch instead. Do NOT turn this back on to paper over such a site.
spring.jpa.open-in-view=false
# HikariCP sizing. CAPACITY NOTE: (max replicas) x (maximum-pool-size) MUST stay
# strictly under PostgreSQL max_connections (minus the admin/replication/Flyway
# reserve), or a rolling deploy or traffic spike will exhaust Postgres and every
# node starts failing to get a connection. e.g. 2 replicas x 20 = 40 connections;
# keep that comfortably below the server's max_connections.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.leak-detection-threshold=20000
# Tomcat worker threads. A request that blocks on a slow external call (provider,
# SMTP) holds a worker thread; cap concurrency so a stall can't spawn unbounded
# threads. accept-count queues bursts beyond the worker pool briefly.
server.tomcat.threads.max=${TOMCAT_THREADS:150}
server.tomcat.accept-count=100

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.sql.init.mode=never

# --- HikariCP --------------------------------------------------------------------------------
# Sized per replica: total = maximum-pool-size x replicas must stay well below the database's
# max_connections (leave room for migrations, admin tools and the dev service). 20 per replica is
# plenty for short OLTP transactions; raising it only helps if load tests show pool waits while the
# DB itself still has headroom. connection-timeout is short on purpose: under overload a request
# fails fast (and shows up in hikaricp_connections_timeout_total) instead of piling up for 30s.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:3000}
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT_MS:2000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1740000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:300000}
spring.datasource.hikari.keepalive-time=${DB_POOL_KEEPALIVE_MS:300000}
spring.datasource.hikari.leak-detection-threshold=${DB_POOL_LEAK_DETECTION_MS:0}
spring.datasource.hikari.pool-name=ecopay-db

# --- Tomcat ----------------------------------------------------------------------------------
server.tomcat.threads.max=${SERVER_TOMCAT_MAX_THREADS:200}
server.tomcat.threads.min-spare=${SERVER_TOMCAT_MIN_SPARE_THREADS:20}
server.tomcat.accept-count=${SERVER_TOMCAT_ACCEPT_COUNT:100}
server.tomcat.connection-timeout=${SERVER_TOMCAT_CONNECTION_TIMEOUT:10s}

# Honour X-Forwarded-* from the reverse proxy (Dokploy/Traefik) so request-derived
# URLs (e.g. avatar links) use the public scheme/host instead of the internal one.
# "native" = Tomcat RemoteIpValve: forwarding headers are trusted ONLY when the TCP peer
# matches internal-proxies, and X-Forwarded-For is walked from the right, so an internet client
# cannot spoof its address past per-IP rate limits. The default regex covers loopback and the
# RFC1918/CGNAT ranges used by the Docker/Traefik network; narrow it per deployment if the
# proxy has a fixed address (env SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES overrides).
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:native}
server.tomcat.remoteip.internal-proxies=10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}|172\\.(1[6-9]|2[0-9]|3[0-1])\\.\\d{1,3}\\.\\d{1,3}|100\\.(6[4-9]|[7-9][0-9]|1[0-1][0-9]|12[0-7])\\.\\d{1,3}\\.\\d{1,3}|127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|0:0:0:0:0:0:0:1|::1

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Almaty
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Single source of truth for time: every JSON timestamp is serialized as
# Asia/Almaty wall clock. LocalDateTime fields are wrapped to +05:00 via a
# custom serializer registered in JacksonAlmatyConfig / JacksonLegacyConfig.
spring.jackson.time-zone=Asia/Almaty

jwt.secret=${JWT_SECRET}
jwt.access-expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}
app.security.field-encryption-key=${APP_SECURITY_FIELD_ENCRYPTION_KEY}
app.auth.refresh-cookie-secure=${APP_AUTH_REFRESH_COOKIE_SECURE:true}
app.auth.refresh-token-body-enabled=${APP_AUTH_REFRESH_TOKEN_BODY_ENABLED:false}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.from=${MAIL_USERNAME}
# Connect/read timeouts so a hung SMTP host cannot pin a request thread. Without
# these, JavaMail waits indefinitely.
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECT_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_READ_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:5000}

# --- Email validation & delivery -------------------------------------------
# Level 2 of the validation pipeline: reject domains that publish no MX (and no
# A) record, so we never spend a confirmation email on a domain that provably
# cannot receive mail. A DNS failure is treated as "unverifiable" and passes —
# our resolver being down must not block legitimate signups.
app.email.mx-check.enabled=${APP_EMAIL_MX_CHECK_ENABLED:true}
app.email.mx-check.timeout-ms=${APP_EMAIL_MX_CHECK_TIMEOUT_MS:2500}
app.email.mx-check.cache-ttl-minutes=${APP_EMAIL_MX_CHECK_CACHE_TTL_MINUTES:1440}
app.email.mx-check.cache-max-size=${APP_EMAIL_MX_CHECK_CACHE_MAX_SIZE:10000}

# Transient SMTP failures are retried with exponential backoff (500ms, 1s, 2s…).
app.email.send.max-attempts=${APP_EMAIL_SEND_MAX_ATTEMPTS:3}
app.email.send.retry-backoff-ms=${APP_EMAIL_SEND_RETRY_BACKOFF_MS:500}

# Probe SMTP once at boot and WARN if unreachable. Never fatal: mail is not on
# the critical path for browsing or for logging in with a verified account.
app.email.startup-check.enabled=${APP_EMAIL_STARTUP_CHECK_ENABLED:true}

app.rate-limit.login.attempts=${APP_RATE_LIMIT_LOGIN_ATTEMPTS:5}
app.rate-limit.login.duration-minutes=${APP_RATE_LIMIT_LOGIN_DURATION_MINUTES:15}
# Second login bucket: failed attempts from one source address per window (0 disables).
app.rate-limit.login.ip-attempts=${APP_RATE_LIMIT_LOGIN_IP_ATTEMPTS:30}
# Rate-limit store: memory (single JVM, dev/test) or jdbc (shared across replicas via the primary
# database). The prod profile defaults to jdbc and the startup guard rejects memory there.
app.rate-limit.store=${APP_RATE_LIMIT_STORE:memory}
# Registration anti-abuse (Block 4a): keyed on BOTH source IP and normalized email.
app.rate-limit.register.ip-max=${APP_RATE_LIMIT_REGISTER_IP_MAX:10}
app.rate-limit.register.ip-window-seconds=${APP_RATE_LIMIT_REGISTER_IP_WINDOW_SECONDS:3600}
app.rate-limit.register.email-max=${APP_RATE_LIMIT_REGISTER_EMAIL_MAX:3}
app.rate-limit.register.email-window-seconds=${APP_RATE_LIMIT_REGISTER_EMAIL_WINDOW_SECONDS:3600}
# Password-reset anti-abuse (Block 4b): per-account cooldown is SILENT (never changes the response,
# preserving the no-enumeration contract); the per-IP cap is address-independent and may surface 429.
app.rate-limit.password-reset.account-max=${APP_RATE_LIMIT_PASSWORD_RESET_ACCOUNT_MAX:3}
app.rate-limit.password-reset.account-window-seconds=${APP_RATE_LIMIT_PASSWORD_RESET_ACCOUNT_WINDOW_SECONDS:900}
app.rate-limit.password-reset.ip-max=${APP_RATE_LIMIT_PASSWORD_RESET_IP_MAX:15}
app.rate-limit.password-reset.ip-window-seconds=${APP_RATE_LIMIT_PASSWORD_RESET_IP_WINDOW_SECONDS:3600}
# InMemoryRateLimiter backing Caffeine cache: bounded size + idle eviction (expire-after-access must
# be >= the largest window above, so an active key is never evicted mid-window).
app.rate-limit.in-memory.max-size=${APP_RATE_LIMIT_IN_MEMORY_MAX_SIZE:200000}
app.rate-limit.in-memory.expire-after-access-seconds=${APP_RATE_LIMIT_IN_MEMORY_EXPIRE_AFTER_ACCESS_SECONDS:86400}
# User-submitted feedback per account per hour. Mirrors RateLimitService style.
# Must stay > 0 — a zero value disables the per-user limiter entirely.
app.rate-limit.feedback.max-per-hour=${APP_RATE_LIMIT_FEEDBACK_MAX_PER_HOUR:5}
# Second layer: per-IP cap so one actor cycling through accounts can't blast.
app.rate-limit.feedback.ip-max-per-hour=${APP_RATE_LIMIT_FEEDBACK_IP_MAX_PER_HOUR:20}

# ── Room creation anti-abuse (per user). Three independent layers; change the
# numbers freely without code edits. Set a *-max to 0 to disable that layer.
# 1) Burst: short-window cap against spamming many rooms at once.
app.rate-limit.room-create.burst-max=${APP_RATE_LIMIT_ROOM_CREATE_BURST_MAX:5}
app.rate-limit.room-create.burst-window-seconds=${APP_RATE_LIMIT_ROOM_CREATE_BURST_WINDOW_SECONDS:600}
# 2) Daily: rolling 24h cap so one user can't create a flood over a day.
app.rate-limit.room-create.daily-max=${APP_RATE_LIMIT_ROOM_CREATE_DAILY_MAX:10}
app.rate-limit.room-create.daily-window-seconds=${APP_RATE_LIMIT_ROOM_CREATE_DAILY_WINDOW_SECONDS:86400}
# 3) Overall: hard ceiling on simultaneously-live rooms (OPEN/IN_VERIFICATION/ACTIVE) per owner.
app.rate-limit.room-create.max-active-per-owner=${APP_RATE_LIMIT_ROOM_CREATE_MAX_ACTIVE_PER_OWNER:10}

# Room join anti-abuse (per user, sliding window).
app.rate-limit.room-join.max=${APP_RATE_LIMIT_ROOM_JOIN_MAX:20}
app.rate-limit.room-join.window-seconds=${APP_RATE_LIMIT_ROOM_JOIN_WINDOW_SECONDS:600}

# Payment-intent creation (initial + renewal) per user; each intent reserves a seat for 30 min.
# Over the limit => 429 RATE_LIMITED.
app.rate-limit.payment-intent.max=${APP_RATE_LIMIT_PAYMENT_INTENT_MAX:10}
app.rate-limit.payment-intent.window-seconds=${APP_RATE_LIMIT_PAYMENT_INTENT_WINDOW_SECONDS:600}
# confirm-success soft limits (NOT 429): over the limit the endpoint returns the current intent
# state from the DB without calling FreedomPay. Per intent at most 1 per N seconds; per user N/min.
app.rate-limit.payment-confirm.per-intent-window-seconds=${APP_RATE_LIMIT_PAYMENT_CONFIRM_PER_INTENT_WINDOW_SECONDS:3}
app.rate-limit.payment-confirm.user-max-per-minute=${APP_RATE_LIMIT_PAYMENT_CONFIRM_USER_MAX_PER_MINUTE:20}

# FX scheduler tuning. Hours between intraday refreshes — kept long enough to
# stay well under any free-tier upstream quota.
app.fx.refresh-interval-hours=${APP_FX_REFRESH_INTERVAL_HOURS:6}
# Public Cache-Control max-age on GET /api/v1/fx/rates (seconds).
app.fx.response-cache-seconds=${APP_FX_RESPONSE_CACHE_SECONDS:900}

# Price Watch — background monitor for third-party subscription prices.
# Toggle the whole module off (scheduler + auto-checks) with app.pricing.enabled=false;
# admin CRUD keeps working either way.
app.pricing.enabled=${APP_PRICING_ENABLED:true}
# Scheduler tick in minutes. The tick just picks providers whose next_check_at has
# come due; each provider's own interval (check_interval_minutes on the row) sets
# how often it actually re-polls.
app.pricing.tick-minutes=${APP_PRICING_TICK_MINUTES:5}
# Default interval used when a provider is created without an explicit one (12h).
app.pricing.default-interval-minutes=${APP_PRICING_DEFAULT_INTERVAL_MINUTES:720}
# Per-request HTTP timeout on outbound fetches.
app.pricing.timeout-seconds=${APP_PRICING_TIMEOUT_SECONDS:8}
app.pricing.connect-timeout-seconds=${APP_PRICING_CONNECT_TIMEOUT_SECONDS:3}
app.pricing.max-compressed-bytes=${APP_PRICING_MAX_COMPRESSED_BYTES:2097152}
app.pricing.max-decompressed-bytes=${APP_PRICING_MAX_DECOMPRESSED_BYTES:8388608}
app.pricing.max-header-bytes=${APP_PRICING_MAX_HEADER_BYTES:32768}
app.pricing.max-redirects=${APP_PRICING_MAX_REDIRECTS:2}
app.pricing.allowed-ports=${APP_PRICING_ALLOWED_PORTS:443}
app.pricing.allowed-hosts=${APP_PRICING_ALLOWED_HOSTS:}
app.pricing.allow-http=${APP_PRICING_ALLOW_HTTP:false}
app.pricing.min-interval-minutes=${APP_PRICING_MIN_INTERVAL_MINUTES:15}
app.pricing.max-interval-minutes=${APP_PRICING_MAX_INTERVAL_MINUTES:43200}
app.pricing.max-price=${APP_PRICING_MAX_PRICE:1000000}
app.pricing.lease-minutes=${APP_PRICING_LEASE_MINUTES:10}
app.pricing.store-sanitized-snippet=${APP_PRICING_STORE_SANITIZED_SNIPPET:false}
app.pricing.admin-rate-limit.max=${APP_PRICING_ADMIN_RATE_LIMIT_MAX:20}
app.pricing.admin-rate-limit.window-seconds=${APP_PRICING_ADMIN_RATE_LIMIT_WINDOW_SECONDS:60}
# Concurrency caps for the scheduler's worker pool.
app.pricing.max-concurrency=${APP_PRICING_MAX_CONCURRENCY:3}
app.pricing.per-domain-concurrency=${APP_PRICING_PER_DOMAIN_CONCURRENCY:1}
# Refresh all due providers on ApplicationReadyEvent. Off by default — turn it on
# only in local dev if you want live data as soon as the app boots.
app.pricing.startup-refresh=${APP_PRICING_STARTUP_REFRESH:false}
# Consecutive failures that flip a provider into FAILING + active=false.
app.pricing.failure-threshold=${APP_PRICING_FAILURE_THRESHOLD:5}
# Outbound User-Agent used on price fetches. Kept as a full realistic Chrome string
# since many providers 403 unknown UAs.
app.pricing.user-agent=${APP_PRICING_USER_AGENT:Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Public brand/contact values. Leave support email empty until a real address exists.
app.brand.name=${APP_BRAND_NAME:EcoPay}
app.brand.support-email=${APP_SUPPORT_EMAIL:}
app.brand.public-url=${APP_PUBLIC_URL:}

# Production readiness confirmations. In the prod profile, startup refuses to proceed until real
# legal details are supplied and Terms/Privacy review is explicitly confirmed.
app.production.legal-entity-name=${APP_PRODUCTION_LEGAL_ENTITY_NAME:}
app.production.legal-bin=${APP_PRODUCTION_LEGAL_BIN:}
app.production.legal-address=${APP_PRODUCTION_LEGAL_ADDRESS:}
app.production.legal-reviewed=${APP_PRODUCTION_LEGAL_REVIEWED:false}

# Public base URL of the backend (used for the email-verification link, handled server-side)
app.base-url=${APP_BASE_URL:http://localhost:8080}
# Public base URL of the frontend SPA (used for the password-reset link, where the user enters a new password)
app.frontend-url=${APP_FRONTEND_URL:${APP_PUBLIC_URL:http://localhost:5173}}

# Active payment provider: freedompay (prod) | mock (dev/test)
ecopay.payments.provider=${PAYMENTS_PROVIDER:freedompay}

# Dev/test only: auto-mark new accounts email-verified so flows that require a verified
# email (login) work without SMTP. Defaults OFF; enabled in application-dev.properties.
app.dev.auto-verify-email=${APP_DEV_AUTO_VERIFY_EMAIL:false}

# Freedom Pay payment gateway
ecopay.payments.freedompay.base-url=${FREEDOMPAY_BASE_URL:https://test-api.freedompay.kz}
ecopay.payments.freedompay.merchant-id=${FREEDOMPAY_MERCHANT_ID:}
ecopay.payments.freedompay.secret-key=${FREEDOMPAY_SECRET_KEY:}
ecopay.payments.freedompay.payout-secret-key=${FREEDOMPAY_PAYOUT_SECRET_KEY:}
ecopay.payments.freedompay.result-url=${FREEDOMPAY_RESULT_URL:http://localhost:8080/api/v1/webhooks/freedompay/result}
ecopay.payments.freedompay.card-storage-result-url=${FREEDOMPAY_CARD_STORAGE_RESULT_URL:http://localhost:8080/api/v1/webhooks/freedompay/card-storage-result}
# Payout-card tokenization (cardstoragepayout/add) callback. Its last path segment is the signed
# script name, so it must end with /payout-card-result.
# Empty = derived from the result URL (same host, /payout-card-result).
ecopay.payments.freedompay.payout-card-result-url=${FREEDOMPAY_PAYOUT_CARD_RESULT_URL:}
ecopay.payments.freedompay.payout-result-url=${FREEDOMPAY_PAYOUT_RESULT_URL:http://localhost:8080/api/v1/webhooks/freedompay/payout-result}
ecopay.payments.freedompay.success-url=${FREEDOMPAY_SUCCESS_URL:http://localhost:5173/payment/confirmation}
ecopay.payments.freedompay.failure-url=${FREEDOMPAY_FAILURE_URL:http://localhost:5173/payment/failure}
# HTTP method FreedomPay uses to return the browser to the success/failure URL (GET|POST, default
# GET). The SPA's /payment/confirmation route only accepts GET, so keep GET unless the return route
# is changed. docs.freedompay.kz "Create payment": pg_success_url_method / pg_failure_url_method.
ecopay.payments.freedompay.success-url-method=${FREEDOMPAY_SUCCESS_URL_METHOD:GET}
ecopay.payments.freedompay.failure-url-method=${FREEDOMPAY_FAILURE_URL_METHOD:GET}
ecopay.payments.freedompay.test-mode=${FREEDOMPAY_TEST_MODE:1}
# pg_recurring_lifetime, in MONTHS (legacy docs: min 1 = 1 month). Required whenever a card is saved
# (pg_recurring_start=1). Current FreedomPay docs cap it at 12, so the gateway clamps to 1..12.
ecopay.payments.freedompay.recurring-lifetime-months=${FREEDOMPAY_RECURRING_LIFETIME_MONTHS:12}
# One-step charges (pg_auto_clearing=1). FreedomPay defaults to two-step; EcoPay must not treat an
# authorization as captured money. The owner payout reserve (app.payout.hold-days) is separate.
ecopay.payments.freedompay.auto-clearing=${FREEDOMPAY_AUTO_CLEARING:true}
# Provider payment page lifetime (pg_lifetime, seconds), aligned with the 30-minute seat reservation.
ecopay.payments.freedompay.payment-lifetime-seconds=${FREEDOMPAY_PAYMENT_LIFETIME_SECONDS:1800}
# Script name and secret for cardstoragepayout/add signatures. Sandbox-verified 2026-10-06: script
# "add" signed with the MERCHANT secret; the payout secret is rejected (error 1100).
ecopay.payments.freedompay.payout-card-storage-script=${FREEDOMPAY_PAYOUT_CARD_STORAGE_SCRIPT:add}
ecopay.payments.freedompay.payout-card-storage-uses-payout-secret=${FREEDOMPAY_PAYOUT_CARD_STORAGE_USES_PAYOUT_SECRET:false}
ecopay.payments.freedompay.legacy-php-endpoints=${FREEDOMPAY_LEGACY_PHP_ENDPOINTS:false}
# Every provider response must carry a valid pg_sig (fail closed). Production refuses false.
ecopay.payments.freedompay.verify-response-signatures=${FREEDOMPAY_VERIFY_RESPONSE_SIGNATURES:true}
# Outbound client hardening: timeouts, per-instance concurrency bulkhead, response size cap and
# bounded retries for read-only (status/list) calls only. Money-moving calls are never retried.
ecopay.payments.freedompay.connect-timeout-ms=${FREEDOMPAY_CONNECT_TIMEOUT_MS:5000}
ecopay.payments.freedompay.read-timeout-ms=${FREEDOMPAY_READ_TIMEOUT_MS:20000}
ecopay.payments.freedompay.max-concurrent-requests=${FREEDOMPAY_MAX_CONCURRENT_REQUESTS:16}
ecopay.payments.freedompay.acquire-timeout-ms=${FREEDOMPAY_ACQUIRE_TIMEOUT_MS:2000}
ecopay.payments.freedompay.max-response-bytes=${FREEDOMPAY_MAX_RESPONSE_BYTES:262144}
ecopay.payments.freedompay.read-retries=${FREEDOMPAY_READ_RETRIES:2}

# Provider status reconciliation of open payment intents (lost callbacks, ambiguous answers).
app.payments.reconciliation.batch-size=${APP_PAYMENTS_RECONCILIATION_BATCH_SIZE:20}
app.payments.reconciliation.spacing-ms=${APP_PAYMENTS_RECONCILIATION_SPACING_MS:1500}
app.payments.reconciliation.delay-ms=${APP_PAYMENTS_RECONCILIATION_DELAY_MS:120000}

# Production MVP: automatic recurring charges are disabled unless explicitly enabled.
app.recurring.enabled=${APP_RECURRING_ENABLED:false}

# Outbound money movement is deny-by-default. Enabling a scheduler is not enough for production:
# ProductionStartupGuard also requires the live-money gate, live Freedom Pay and a 30-day hold.
app.money.live-enabled=${APP_MONEY_LIVE_ENABLED:false}
app.money.payout-dispatch-enabled=${APP_MONEY_PAYOUT_DISPATCH_ENABLED:false}
app.money.refund-dispatch-enabled=${APP_MONEY_REFUND_DISPATCH_ENABLED:false}
app.money.post-payout-refund-enabled=${APP_MONEY_POST_PAYOUT_REFUND_ENABLED:false}
app.money.owner-receivable-enabled=${APP_MONEY_OWNER_RECEIVABLE_ENABLED:false}
app.payout.hold-days=${APP_PAYOUT_HOLD_DAYS:30}
app.payout.batch-coalesce-hours=${APP_PAYOUT_BATCH_COALESCE_HOURS:24}
app.payout.dispatch-delay-ms=${APP_PAYOUT_DISPATCH_DELAY_MS:60000}
app.access.deemed-confirmation-hours=${APP_ACCESS_DEEMED_CONFIRMATION_HOURS:72}
app.access.deemed-confirmation-delay-ms=${APP_ACCESS_DEEMED_CONFIRMATION_DELAY_MS:60000}

# Tiered EcoPay commission, charged on top of each member's tariff share (owner pays none).
# Member pays (share + commission); owner is paid the share; EcoPay keeps the commission.
# Mixed rooms (existingMembersCount = 2) use a fixed marketplace fee instead of tier fees.
#   share <= tier1-max          -> tier1-fee
#   tier1-max < share <= tier2-max -> tier2-fee
#   tier2-max < share <= tier3-max -> tier3-fee
#   share > tier3-max           -> tier4-fee
app.commission.tier1-max=4000
app.commission.tier2-max=6000
app.commission.tier3-max=8000
app.commission.tier1-fee=500
app.commission.tier2-fee=700
app.commission.tier3-fee=900
app.commission.tier4-fee=1000
app.commission.mixed-room-marketplace-fee=${APP_COMMISSION_MIXED_ROOM_MARKETPLACE_FEE:450}

# S3-compatible object storage for avatars (Cloudflare R2)
app.s3.region=${S3_REGION:auto}
app.s3.bucket=${S3_BUCKET:}
app.s3.endpoint=${S3_ENDPOINT:}
app.s3.access-key=${S3_ACCESS_KEY:}
app.s3.secret-key=${S3_SECRET_KEY:}
app.s3.path-style-access=${S3_PATH_STYLE_ACCESS:true}

# Served media (news/stories images): in-process byte cache + card previews.
# cache-max-bytes: total size budget for the cached original/preview bytes (default 64 MiB).
app.media.cache-max-bytes=${APP_MEDIA_CACHE_MAX_BYTES:67108864}
# cache-ttl-seconds: how long bytes stay cached (keys are immutable, so this is purely a memory TTL).
app.media.cache-ttl-seconds=${APP_MEDIA_CACHE_TTL_SECONDS:86400}
# negative-cache-seconds: how long a 404 is remembered so a missing key is not re-queried from R2.
app.media.negative-cache-seconds=${APP_MEDIA_NEGATIVE_CACHE_SECONDS:60}
# Card preview widths (long edge), re-encoded at JPEG quality 0.8.
app.media.news-thumb-width=${APP_MEDIA_NEWS_THUMB_WIDTH:640}
app.media.story-thumb-width=${APP_MEDIA_STORY_THUMB_WIDTH:480}

# SMS provider
ecopay.sms.provider=${SMS_PROVIDER:logging}
ecopay.sms.mobizon.base-url=${MOBIZON_BASE_URL:https://api.mobizon.kz}
ecopay.sms.mobizon.api-key=${MOBIZON_API_KEY:}
ecopay.sms.mobizon.from=${MOBIZON_FROM:EcoPay}
app.sms.code-ttl-seconds=${APP_SMS_CODE_TTL_SECONDS:300}
app.sms.resend-cooldown-seconds=${APP_SMS_RESEND_COOLDOWN_SECONDS:60}
app.sms.max-attempts-per-hour=${APP_SMS_MAX_ATTEMPTS_PER_HOUR:3}
app.sms.max-verify-attempts=${APP_SMS_MAX_VERIFY_ATTEMPTS:5}
app.sms.max-per-ip-per-hour=${APP_SMS_MAX_PER_IP_PER_HOUR:10}
app.sms.max-per-ip-per-day=${APP_SMS_MAX_PER_IP_PER_DAY:30}
# Dev/test-only master phone-verification code. Empty by default so every
# non-dev profile requires the real SMS code.
app.phone.dev-bypass-code=${APP_PHONE_DEV_BYPASS_CODE:}

# Durable Freedom Pay webhook inbox. Processing is at-least-once; downstream money operations
# and the inbox PROCESSED transition commit atomically. Exhausted/non-retryable events remain in
# freedom_webhook_inbox with processing_status=DEAD_LETTER for operational investigation.
app.webhooks.freedom.retry-delay-ms=${APP_WEBHOOKS_FREEDOM_RETRY_DELAY_MS:60000}
app.webhooks.freedom.max-attempts=${APP_WEBHOOKS_FREEDOM_MAX_ATTEMPTS:6}
app.webhooks.freedom.retry-base-seconds=${APP_WEBHOOKS_FREEDOM_RETRY_BASE_SECONDS:30}
app.webhooks.freedom.retry-max-seconds=${APP_WEBHOOKS_FREEDOM_RETRY_MAX_SECONDS:3600}
app.webhooks.freedom.lease-seconds=${APP_WEBHOOKS_FREEDOM_LEASE_SECONDS:300}
app.webhooks.freedom.batch-size=${APP_WEBHOOKS_FREEDOM_BATCH_SIZE:100}

# health for probes, prometheus for the in-cluster scraper (private-network peers only, see
# SecurityConfig/InternalNetworkAccess). Never expose env/heapdump/loggers/beans.
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_EXPOSURE:health,prometheus}
management.metrics.tags.application=ecopay-backend
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Identifier reveal is sensitive PII access. Owner and staff buckets are separated, and each
# request is limited by actor and roomMember.
app.identifier-reveal.ttl-seconds=${APP_IDENTIFIER_REVEAL_TTL_SECONDS:30}
app.rate-limit.identifier-reveal.owner.burst-max=${APP_RATE_LIMIT_IDENTIFIER_REVEAL_OWNER_BURST_MAX:5}
app.rate-limit.identifier-reveal.owner.burst-window-seconds=${APP_RATE_LIMIT_IDENTIFIER_REVEAL_OWNER_BURST_WINDOW_SECONDS:60}
app.rate-limit.identifier-reveal.owner.daily-max=${APP_RATE_LIMIT_IDENTIFIER_REVEAL_OWNER_DAILY_MAX:30}
app.rate-limit.identifier-reveal.owner.daily-window-seconds=${APP_RATE_LIMIT_IDENTIFIER_REVEAL_OWNER_DAILY_WINDOW_SECONDS:86400}
app.rate-limit.identifier-reveal.staff.burst-max=${APP_RATE_LIMIT_IDENTIFIER_REVEAL_STAFF_BURST_MAX:10}
app.rate-limit.identifier-reveal.staff.burst-window-seconds=${APP_RATE_LIMIT_IDENTIFIER_REVEAL_STAFF_BURST_WINDOW_SECONDS:60}
app.rate-limit.identifier-reveal.staff.daily-max=${APP_RATE_LIMIT_IDENTIFIER_REVEAL_STAFF_DAILY_MAX:80}
app.rate-limit.identifier-reveal.staff.daily-window-seconds=${APP_RATE_LIMIT_IDENTIFIER_REVEAL_STAFF_DAILY_WINDOW_SECONDS:86400}
