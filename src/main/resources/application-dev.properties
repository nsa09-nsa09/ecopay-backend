logging.level.kz.hrms.splitupauth=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.flywaydb=DEBUG

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

app.auth.refresh-token-body-enabled=true
# Local Vite and Spring run over plain HTTP. A Secure cookie is discarded by browsers in that
# setup, which makes every page reload look like an expired session. Production overrides this to
# true in application-prod.properties.
app.auth.refresh-cookie-secure=false

# CI integration tests use the dev profile with Testcontainers, so Flyway stays enabled by
# default. Local run.ps1/run.sh set FLYWAY_ENABLED=false for the restricted Cockroach Cloud dev user
# and JPA_DDL_AUTO=update so additive dev tables can still be created locally.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
# Shared dev databases may contain teammate migrations that are not in this checkout.
# Keep this tolerance physically isolated to the dev profile; prod validates strictly.
spring.flyway.ignore-migration-patterns=*:missing

# Dev: default to the in-memory mock payment gateway (no real Freedom Pay
# credentials needed). Set PAYMENTS_PROVIDER=freedompay in the environment to
# run real Freedom Pay sandbox transactions (requires FREEDOMPAY_MERCHANT_ID /
# FREEDOMPAY_SECRET_KEY to be set).
ecopay.payments.provider=${PAYMENTS_PROVIDER:mock}

# Dev/test only: master phone-verification code (real SMS codes are only logged in dev).
app.phone.dev-bypass-code=000000

# Dev/test only: auto-verify email on registration so login works without SMTP.
app.dev.auto-verify-email=false

# Price Watch — dev defaults. Keep the scheduler on, but shrink the tick a bit for
# faster feedback. Startup refresh is intentionally OFF to avoid hitting third-
# party sites just because you booted the app.
app.pricing.enabled=true
app.pricing.tick-minutes=1
app.pricing.default-interval-minutes=60
app.pricing.timeout-seconds=8
app.pricing.allow-http=true
app.pricing.allowed-ports=80,443,8080,8443
app.pricing.max-concurrency=2
app.pricing.per-domain-concurrency=1
app.pricing.startup-refresh=false
app.pricing.failure-threshold=5
